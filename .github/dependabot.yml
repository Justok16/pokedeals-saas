version: 2
updates:
  # Une PR par mise à jour majeure (à relire), mais UNE seule PR groupée pour
  # toutes les mises à jour mineures et correctives de la semaine (06/10/2026) :
  # moins de PR, moins de conflits de lockfile entre elles. Chaque PR est vérifiée
  # par la CI (typecheck + lint + build, cf. .github/workflows/ci.yml) avant tout
  # merge -- jamais de mise à jour silencieuse.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
